# Bonus B-05 — same-origin reverse proxy in front of the static React build.
#
# The browser executes this app client-side, so it can never resolve a
# Docker Compose service name like "server" — everything the browser talks
# to must be THIS origin. /api and /hubs are proxied server-side (nginx ->
# the "server" service, which Docker Compose's internal DNS *can* resolve)
# so REST and SignalR both work through one origin, with no CORS involved
# at all from the browser's point of view.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # SignalR negotiates a transport and may upgrade to a real WebSocket —
    # this is the standard nginx WebSocket-proxying idiom (falls back to
    # "close" for a plain HTTP request, which is what Server-Sent
    # Events/long-polling — SignalR's own fallback transports — need).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # REST — exact prefix the API is actually mapped under
        # (Controllers use [Route("api/...")]).
        location /api/ {
            proxy_pass http://server:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SignalR — the exact route RunHub is mapped under
        # (app.MapHub<RunHub>("/hubs/runs") in Program.cs). WebSocket
        # upgrade headers are required here; REST alone would leave TM-03's
        # live updates falling back to slow long-polling instead of
        # connecting live.
        location /hubs/ {
            proxy_pass http://server:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Swagger — preserved and reachable through the same origin too.
        location /swagger/ {
            proxy_pass http://server:8080;
            proxy_set_header Host $host;
        }

        # React Router (client-side routing) — any other path falls back to
        # index.html so a direct load of e.g. /runs/12 doesn't 404 at nginx.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
